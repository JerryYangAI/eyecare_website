name: Deploy to Aliyun OSS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned deployment dependencies
        run: npm ci --ignore-scripts

      - name: Strict local validation and tests
        run: npm run qa

      - name: Setup ossutil
        uses: manyuanrong/setup-ossutil@v3.0
        with:
          endpoint: ${{ secrets.OSS_ENDPOINT }}
          access-key-id: ${{ secrets.OSS_ACCESS_KEY_ID }}
          access-key-secret: ${{ secrets.OSS_ACCESS_KEY_SECRET }}

      - name: Upload public website to OSS
        run: |
          ossutil cp -r -f --meta Cache-Control:no-cache \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".gstack" \
            --exclude ".well-known" \
            --exclude "agent-api" \
            --exclude "cms-auth" \
            --exclude "edge" \
            --exclude "scripts" \
            --exclude "tests" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "qa-report.md" \
            --exclude "README.md" \
            --exclude "后台部署配置指南.md" \
            ./ oss://${{ secrets.OSS_BUCKET }}/

      - name: Upload agent discovery artifacts with explicit MIME types
        run: |
          ossutil cp -r -f --meta Cache-Control:no-cache \
            ./.well-known/ oss://${{ secrets.OSS_BUCKET }}/.well-known/
          ossutil cp -f --meta Cache-Control:no-cache#Content-Type:application/linkset+json \
            ./.well-known/api-catalog oss://${{ secrets.OSS_BUCKET }}/.well-known/api-catalog
          ossutil cp -f --meta Cache-Control:no-cache#Content-Type:text/markdown \
            ./index.md oss://${{ secrets.OSS_BUCKET }}/index.md

      - name: Deploy and verify read-only MCP with the official SDK
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/deploy-agent-api.cjs

      - name: Preserve existing API routes and mount MCP
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: node scripts/configure-fc-route.cjs

      - name: Setup Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1

      - name: Configure Link, Markdown and DNS-AID discovery
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          ALIBABA_CLOUD_REGION_ID: cn-hangzhou
          ALIBABA_CLOUD_IGNORE_PROFILE: 'TRUE'
        run: node scripts/configure-aliyun-discovery.mjs

      - name: Production smoke test
        env:
          SMOKE_TIMEOUT_MS: 300000
        run: npm run smoke:production
