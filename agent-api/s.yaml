edition: 3.0.0
name: koushicare-agent-ready
access: default

resources:
  public_information_mcp:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: koushicare-public-information-mcp
      description: 品川光医只读公开信息 MCP 服务
      runtime: nodejs20
      code: ./
      handler: index.handler
      memorySize: 128
      diskSize: 512
      timeout: 15
      instanceConcurrency: 20
      triggers:
        - triggerName: public-information-http
          description: Anonymous MCP Streamable HTTP endpoint
          qualifier: LATEST
          triggerType: http
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - OPTIONS
              - HEAD
